[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "depegsentinel-solana"
version = "0.1.0"
description = "Python SDK for DepegSentinel Pre-Oracle Risk Telemetry on Solana"
authors = [{ name = "Koam Analytics", email = "wjesus19697106@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "solders>=0.21.0",
    "solana>=0.34.0",
    "websockets>=12.0",
    "httpx>=0.27.0"
]
